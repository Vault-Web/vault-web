name: Frontend CI

permissions:
  contents: read

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # - name: Run ESLint
      #   working-directory: frontend
      #   run: npm run lint

      - name: Check formatting with Prettier
        working-directory: frontend
        run: npm run prettier:check

      # The full legacy suite has unrelated baseline failures. Keep this
      # regression contract enforced independently until those are repaired.
      - name: Test cloud editor save HTTP contract
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless --include=src/app/pages/cloud/cloud-file-save.spec.ts

      - name: Build project
        working-directory: frontend
        run: npm run build
