spring.application.name=backend
server.port=8080
# PostgreSQL DB Connection
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.url=jdbc:postgresql://localhost:5433/vault-db
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Ensure deterministic timestamps across environments
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIMEZONE:UTC}
# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.configUrl=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
# Token signing secrets. There are deliberately no defaults: they come from the environment, and
# the application refuses to start without them (see SigningSecrets and backend/README.md).
# jwt.secret is shared with cloud-page, which must be configured with the same value.
jwt.secret=${JWT_SECRET:}
logging.level.org.springframework.security=INFO
jwt.refreshSecret=${JWT_REFRESHSECRET:}
refresh.cleanup.days=3

app.rate-limit-per-minute=100

# ─── Profile Picture Storage ────────────────────────────────────────────────
# Where to store uploaded profile pictures on disk (relative to where the app runs).
# The ProfilePictureService reads this value via @Value("${app.upload.profile-picture.dir}").
app.upload.profile-picture.dir=uploads/profile-pictures

# Maximum allowed upload size in megabytes. Files larger than this will be rejected.
app.upload.profile-picture.max-size-mb=2

# ??? Media streaming proxy ??????????????????????????????????????????????????
# Dedicated signing key for media tokens. MUST differ from jwt.secret: media tokens
# travel in URLs, and jwt.secret is shared with cloud-page, so a media token signed
# with it would be a valid access token for both services.
jwt.mediaSecret=${JWT_MEDIASECRET:}
app.media.token-ttl-seconds=300
app.cloudpage.base-url=http://localhost:8090
# cloud-page uses a self-signed dev certificate. Local development only.
app.cloudpage.trust-self-signed=false