# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (use test values)
jwt.secret=test_secret_key_for_unit_testing_only_32_chars_
jwt.refreshSecret=test_refresh_secret_for_testing_only_32_chars
jwt.mediaSecret=test_media_secret_for_testing_only_32_chars_

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# Personal access tokens (low limits so throttling is testable)
app.pat.rate-limit-per-minute=10
app.pat.owner-rate-limit-per-minute=50
# Global per-IP limiter: all MockMvc traffic shares 127.0.0.1 in one cached context
app.rate-limit-per-minute=10000
